name: Actualizar DDGS (USGC)

# Precio semanal de DDGS FOB Vessel Gulf desde el reporte semanal de DDGS de USGC
# (https://grains.org/ddgs_report/), tabla de la página 2 del PDF. USGC publica una vez por
# semana (normalmente el jueves), así que basta con revisar una vez al día: si no hay
# reporte nuevo, el script no toca nada y no hay commit.
#
# Va separado del workflow de Yahoo a propósito: si USGC cambia el formato del PDF,
# falla solo este job (en rojo, para que se note) y los precios de Yahoo siguen igual.
on:
  schedule:
    - cron: "0 13 * * *"  # todos los días a las 13:00 UTC
  workflow_dispatch:
    inputs:
      historico:
        description: "Completar el histórico desde enero de 2021 (solo agrega semanas que falten)"
        type: boolean
        default: false

concurrency:
  group: actualizar-ddgs
  cancel-in-progress: false

permissions:
  contents: write  # para hacer commit+push del JSON actualizado

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pdftoppm y tesseract (OCR de la tabla del PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Bajar el reporte de USGC, leer la tabla y fusionar
        run: |
          if [ "${{ inputs.historico }}" = "true" ]; then
            python3 scripts/historico_ddgs.py
          else
            python3 scripts/fetch_ddgs.py
          fi

      - name: Commit y push si hubo cambios
        # También si el paso anterior terminó en rojo: lo que sí se leyó ya está validado
        # y se guarda; el rojo queda visible para revisar qué faltó.
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historia/ddgs_fob_gulf.json
          if git diff --cached --quiet; then
            echo "Sin cambios — no hay reporte nuevo de DDGS."
            exit 0
          fi
          git commit -m "Actualización automática de DDGS ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # El workflow de Yahoo hace push cada 15 min; si llegó antes, se trae su commit
          # (toca otros archivos, así que no hay conflicto) y se reintenta.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
