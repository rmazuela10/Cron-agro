name: Actualizar precios de commodities

# IMPORTANTE SOBRE EL HORARIO: GitHub Actions solo acepta cron en UTC (no admite
# CRON_TZ como la tarea programada original en Claude). Los horarios de abajo
# (11, 15, 19, 23 UTC) equivalen a 8:00 / 12:00 / 16:00 / 20:00 hora de Chile
# SOLO mientras Chile está en horario de verano (UTC-3, vigente desde el
# 6 de septiembre de 2026). Cuando Chile vuelva a horario de invierno (UTC-4,
# normalmente en abril), hay que restar 1 hora a cada valor (10,14,18,22 UTC)
# para seguir cayendo a las mismas horas locales. GitHub no hace este ajuste solo.
on:
  schedule:
      - cron: "0 11,15,19,23 * * 1-5"  # lun-vie, horario de verano Chile
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions, para probar        

  permissions:
    contents: write  # necesario para que el job pueda hacer commit+push del JSON actualizado

jobs:    
  actualizar:
    runs-on: ubuntu-latest          
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

      - name: Fetch + parseo defensivo + cross-check + fusión
        run: python3 scripts/fetch_and_update.py
    - name: Commit y push si hubo cambios
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/historia/
        if git diff --cached --quiet; then
          echo "Sin cambios — no hay nada nuevo que publicar esta corrida."
      else
        git commit -m "Actualización automática de precios ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
        git push
    fi
