name: Actualizar precios de commodities

# Corre cada 15 minutos, lunes a viernes, las 24 horas. Al no fijar una hora exacta
# (como antes con 11,15,19,23 UTC) ya no hace falta el ajuste de horario de verano/
# invierno de Chile — "cada 15 minutos todo el día" significa lo mismo sin importar
# el huso horario. GitHub Actions no garantiza el minuto exacto bajo carga alta de
# la plataforma (puede atrasarse unos minutos), pero el mínimo que soporta de forma
# confiable son 5 minutos; 15 minutos deja margen cómodo. El script no hace ningún
# commit si no hay datos nuevos que publicar, así que correr seguido no genera ruido
# en el historial de git ni trabajo extra cuando el mercado está cerrado.
on:
  schedule:
    - cron: "*/15 * * * 1-5"  # cada 15 min, lun-vie
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions, para probar

# Con una corrida cada 15 minutos hay más chance de que dos ejecuciones se
# superpongan (por ejemplo si una corrida manual coincide con la programada, o una
# corrida queda lenta por Yahoo). Sin esto, dos "git push" casi simultáneos podrían
# chocar (el segundo quedaría con un checkout desactualizado). "group" hace que una
# corrida nueva espere a que termine la anterior en vez de correr en paralelo;
# cancel-in-progress:false asegura que ninguna corrida se cancele a medio camino.
concurrency:
  group: actualizar-precios
  cancel-in-progress: false

permissions:
  contents: write  # necesario para que el job pueda hacer commit+push del JSON actualizado

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch + parseo defensivo + cross-check + fusión
        run: python3 scripts/fetch_and_update.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historia/
          if git diff --cached --quiet; then
            echo "Sin cambios — no hay nada nuevo que publicar esta corrida."
          else
            git commit -m "Actualización automática de precios ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
