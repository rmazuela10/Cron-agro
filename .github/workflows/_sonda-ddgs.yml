name: Sonda DDGS (temporal)
on:
  push:
    branches: [claude/project-thread-rbgqbe]
    paths: ["scripts/_sonda_ddgs.py", ".github/workflows/_sonda-ddgs.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1
      - run: python3 scripts/fetch_ddgs.py --historico
      - run: python3 scripts/_sonda_ddgs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historia/ddgs_fob_gulf.json
          git commit -m "Carga inicial del histórico de DDGS FOB Golfo desde USDA AMS (jul-2022 en adelante)" && git push
