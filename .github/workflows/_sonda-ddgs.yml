name: Sonda DDGS (temporal)
on:
  push:
    branches: [claude/project-thread-rbgqbe]
    paths: [".github/workflows/_sonda-ddgs.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1
      - run: python3 -u scripts/historico_ddgs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historia/ddgs_fob_gulf.json
          git diff --cached --quiet || (git commit -m "Completar el histórico de DDGS FOB Golfo desde USDA AMS (jul-2022 en adelante)" && git push)
