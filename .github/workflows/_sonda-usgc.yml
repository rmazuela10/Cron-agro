name: Sonda USGC (temporal)
on:
  push:
    branches: [claude/project-thread-rbgqbe]
    paths: ["_sonda/sonda.py", ".github/workflows/_sonda-usgc.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: python3 -u _sonda/sonda.py
        if: success() || failure()
      - if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _sonda/pdfs
          git commit -m "Sonda: muestra de PDFs" && git push
