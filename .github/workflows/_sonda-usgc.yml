name: Sonda USGC (temporal)
on:
  push:
    branches: [claude/project-thread-rbgqbe]
    paths: ["scripts/_sonda_usgc.py", ".github/workflows/_sonda-usgc.yml"]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null 2>&1
      - run: python3 -u scripts/_sonda_usgc.py
