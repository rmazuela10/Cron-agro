name: Sonda USGC (temporal) - probar fetch_ddgs.py (corrida diaria)
on:
  push:
    branches: [claude/project-thread-rbgqbe]
    paths: ["_sonda/sonda.py", ".github/workflows/_sonda-usgc.yml"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils && sudo apt-get install -y -qq tesseract-ocr && pip install -q pillow numpy && python3 -u scripts/fetch_ddgs.py && git status --short
      - if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historia/ddgs_fob_gulf.json
          git commit -m "Sonda: corrida diaria de prueba" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
